name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uvx pre-commit run --all-files --show-diff-on-failure

  # Renders every language/profile/framework combination and checks each project builds,
  # tests and enforces its hooks: the template's real contract.
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # copier clones this repo to render it; a full clone avoids shallow-clone edge cases
      # Tools the C renders need that aren't on the runner; locally these tests skip instead.
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy libcriterion-dev
      - uses: astral-sh/setup-uv@v7
      # Rendered projects install their own hooks (ruff, clang-format, ...) on every test.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-renders-${{ hashFiles('template/.pre-commit-config.yaml.jinja') }}
      - run: uv sync --locked
      - run: uv run pytest

  # Squash-merge makes the PR title the commit on main, and release-please builds the
  # changelog from those commits, so titles must be Conventional Commits.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
