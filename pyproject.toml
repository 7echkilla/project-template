[project]
name = "project-template"
version = "0.0.0"
description = "Copier template: dev tooling and tests for the template itself"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "copier>=9.4",
    "pre-commit>=4",
    "ninja>=1.13",  # CMake generator for C renders; keeps the tests free of system installs
    "pytest>=8",
    "pyyaml>=6",
]

[tool.uv]
# Not a distributable package, just a managed dev environment.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Rendering uncommitted template changes is the point of vcs_ref="HEAD" in the tests.
filterwarnings = ["ignore:Dirty template changes included automatically"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]
