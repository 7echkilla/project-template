# GitHub issue form: structured fields, so a report always says how to reproduce it.
name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the full error output, if any.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 / a1b2c3d
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, compiler / Python version, hardware if relevant.
